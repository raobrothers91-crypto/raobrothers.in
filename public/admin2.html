<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rao Brothers OLT Groups</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#061426;color:#eef8ff}.app{max-width:1200px;margin:auto;min-height:100vh}.top{padding:20px;background:#061426;border-bottom:1px solid #24577d;display:flex;justify-content:space-between}.logo{font-size:25px;font-weight:bold}.sub,.muted{color:#9fc1d9;font-size:12px}.menu{display:flex;gap:8px;overflow:auto;padding:12px;background:#0b2742}.menu button,button{padding:10px 14px;background:#159be6;color:#fff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}.card{background:#0d2944;border:1px solid #24577d;border-radius:15px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #234e70;font-size:13px}input,select,textarea{width:100%;padding:11px;margin:5px 0;background:#071b2d;border:1px solid #356a90;border-radius:8px;color:white}.group{border:2px solid #2d6b91}.badge{display:inline-block;padding:5px 9px;border-radius:15px;background:#123d58;color:#75d9ff;font-size:11px}.small{font-size:11px}@media(max-width:650px){.app{width:100%}.card{border-radius:10px}}
</style></head><body><div class="app"><div class="top"><div><div class="logo">RAO BROTHERS</div><div class="sub">OLT / CUSTOMER GROUP ADMIN PANEL</div></div><div>🗂️ Admin 2</div></div><div class="menu"><button onclick="location.href='/admin'">← Main Admin</button><button onclick="load()">🔄 Refresh</button></div><div style="padding:18px"><div class="card"><h2>Customers by OLT</h2><div class="muted">Har OLT ke customers alag group me. Customer ko main Admin → Add Customer me OLT select karke group kiya jayega.</div></div><div id="groups" class="grid"></div><div id="detail"></div></div></div><script>
const qs=new URLSearchParams(location.search);const selected=qs.get('olt');
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function load(){try{const [or,cr]=await Promise.all([fetch('/api/olts'),fetch('/api/customers')]);const olts=await or.json(),cs=await cr.json();const groups=document.getElementById('groups');groups.innerHTML=olts.map(o=>{const arr=cs.filter(c=>c.oltId===o.id);return '<div class="card group"><h2>'+esc(o.id)+' — '+esc(o.name)+'</h2><div class="muted">📍 '+esc(o.location||'')+' • 👥 '+arr.length+' customers</div><button onclick="showGroup(''+o.id+')">VIEW CUSTOMERS</button></div>'}).join('')||'<div class="card">No OLT groups.</div>';if(selected)showGroup(selected)}catch(e){document.getElementById('groups').innerHTML='<div class="card">Backend not connected.</div>'}}
async function showGroup(id){const [or,cr]=await Promise.all([fetch('/api/olts'),fetch('/api/customers')]);const os=await or.json(),cs=await cr.json(),o=os.find(x=>x.id===id),arr=cs.filter(c=>c.oltId===id);document.getElementById('detail').innerHTML='<div class="card"><h2>'+esc(o?o.id:id)+' — '+esc(o?.name||'OLT')+'</h2><div class="muted">'+esc(o?.location||'')+' • '+arr.length+' customers</div><table><tr><th>ID</th><th>Name</th><th>Mobile</th><th>PPPoE</th><th>Plan</th><th>Price</th><th>Status</th></tr>'+arr.map(c=>'<tr><td>'+esc(c.id)+'</td><td>'+esc(c.name)+'</td><td>'+esc(c.mobile)+'</td><td>'+esc(c.pppoe)+'</td><td>'+esc(c.plan)+'</td><td>₹'+esc(c.price)+'</td><td><span class="badge">'+esc(c.status)+'</span></td></tr>').join('')+'</table><hr><h3>Send Message to this OLT Group</h3><input id="mtitle" value="Rao Brothers Message"><textarea id="mmsg" placeholder="Message for all customers of this OLT"></textarea><button onclick="sendGroup(''+id+')">📢 SEND TO THIS OLT GROUP</button><div id="mres" class="muted"></div></div>'}
async function sendGroup(id){const title=document.getElementById('mtitle').value.trim(),message=document.getElementById('mmsg').value.trim();if(!message)return alert('Message required');const r=await fetch('/api/notification',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:'OLT:'+id,title,message})});const x=await r.json();document.getElementById('mres').textContent=r.ok?'✅ Message sent to '+id+' customers':('❌ '+(x.error||'Failed'))}
load();setInterval(load,5000);
</script></body></html>
